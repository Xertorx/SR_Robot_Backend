services:
  api:
    build: .
    ports:
      - "3000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_local}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-cambia_este_webhook_local}
      SEED_DATA: ${SEED_DATA:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
